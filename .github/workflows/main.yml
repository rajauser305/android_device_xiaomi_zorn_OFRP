name: Matrix Build OrangeFox

on:
  push:
    branches: [ main, fox_14.1 ]
  pull_request:
    branches: [ fox_14.1 ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly build

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        android_version: [11, 12, 14]
        include:
          - android_version: 11
            fox_branch: ofox-11
          - android_version: 12
            fox_branch: ofox-12
          - android_version: 14
            fox_branch: ofox-14.1
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Setup Build Environment
      uses: android-actions/setup-android@v2
      
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache libssl-dev rsync
        
    - name: Setup CCache
      uses: actions/cache@v3
      with:
        path: /tmp/ccache
        key: ${{ runner.os }}-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-ccache-
          
    - name: Build OrangeFox
      env:
        DEVICE: zorn
        FOX_BRANCH: ${{ matrix.fox_branch }}
        USE_CCACHE: 1
        CCACHE_EXEC: /usr/bin/ccache
        CCACHE_DIR: /tmp/ccache
      run: |
        # Your build script here
        ./build.sh $DEVICE $FOX_BRANCH
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: OrangeFox-${{ matrix.android_version }}-${{ github.sha }}
        path: |
          out/target/product/${{ env.DEVICE }}/*.img
          out/target/product/${{ env.DEVICE }}/*.zip
          
  notify:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
