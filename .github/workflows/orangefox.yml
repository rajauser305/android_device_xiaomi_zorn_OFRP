name: Build OrangeFox Recovery

on:
  push:
    branches: [ fox_14.1 ]
  pull_request:
    branches: [ fox_14.1 ]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build (remove out directory)'
        required: false
        default: 'false'
jobs:
   build:
    runs-on: ubuntu-latest
    
    env:
      LUNCH_TARGET: zorn
      BUILD_TARGET: recoveryimage
      DEVICE_PATH: xiaomi/zorn
      DEVICE_TREE_URL: https://github.com/rajauser305/android_device_xiaomi_zorn_OFRP
      DEVICE_TREE_BRANCH: fox_14.1
      BUILD_DATE: ${{ github.event.head_commit.timestamp || format(time(), '%Y-%m-%d') }}
      
    steps:
    - name: Check Current Time
      run: date
      
    - name: Checkout Source Code
      uses: actions/checkout@v3
      with:
        path: fox
      
    - name: Setup Build Environment
      uses: android-actions/setup-android@v2
      
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip \
          curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev \
          x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
          xsltproc unzip fontconfig python3 python-is-python3
        
    - name: Clone Device Tree
      run: |
        cd fox
        mkdir -p device/xiaomi
        rm -rf device/xiaomi/zorn
        git clone $DEVICE_TREE_URL -b $DEVICE_TREE_BRANCH device/xiaomi/zorn
        
    - name: Verify Device Tree
      run: |
        cd fox
        echo "=== Checking device tree structure ==="
        ls -la device/xiaomi/zorn/
        echo "=== Checking patches directory ==="
        ls -la device/xiaomi/zorn/patches/ || echo "No patches directory found"
        
    - name: Apply Recovery Patches
      run: |
        cd fox
        echo "=== Checking for recovery patches ==="
        
        # Check if patches directory exists
        if [ -d "device/xiaomi/zorn/patches" ]; then
          echo "Patches directory exists"
          
          # Count patch files
          patch_count=$(find device/xiaomi/zorn/patches -name "*.patch" -type f | wc -l)
          echo "Found $patch_count patch file(s)"
          
          # Apply patches if any exist
          if [ $patch_count -gt 0 ]; then
            echo "Applying patches to bootable/recovery..."
            cd bootable/recovery
            
            # Apply each patch individually
            for patch_file in $WORKINGDIR/device/xiaomi/zorn/patches/*.patch; do
              if [ -f "$patch_file" ]; then
                echo "Applying patch: $(basename $patch_file)"
                git apply "$patch_file" || echo "Warning: Failed to apply $(basename $patch_file)"
              fi
            done
            
            cd $WORKINGDIR
          else
            echo "No patch files found, skipping..."
          fi
        else
          echo "No patches directory, skipping..."
        fi
        
    - name: Clone Additional Dependencies
      run: |
        cd fox
        echo "=== Cloning external/libmicrohttpd ==="
        rm -rf external/libmicrohttpd
        git clone https://github.com/adontoo/android_external_libmicrohttpd -b ofox-14.1 external/libmicrohttpd
        
        echo "=== Cloning bionic ==="
        rm -rf bionic
        git clone https://github.com/adontoo/OrangeFox-android_platform_bionic bionic
        
    - name: Setup Build Environment Variables
      run: |
        cd fox
        # Set environment variables
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export LC_ALL=C
        export FOX_VERSION=R11.1_2
        export FOX_VARIANT=11.2
        
        # Source build environment
        source build/envsetup.sh
        
    - name: Clean Build (Optional)
      if: github.event.inputs.clean_build == 'true'
      run: |
        cd fox
        rm -rf out
        
    - name: Lunch Device
      run: |
        cd fox
        source build/envsetup.sh
        lunch omni_zorn-eng || lunch twrp_zorn-eng || lunch lineage_zorn-eng
        
    - name: Build Recovery
      run: |
        cd fox
        export FOX_BUILD_TYPE=Stable
        export FOX_MAINTAINER="YourName"
        
        # Build recovery
        mka $BUILD_TARGET -j$(nproc --all) || make $BUILD_TARGET -j$(nproc --all)
        
    - name: Check Build Output
      run: |
        cd fox
        echo "=== Checking output directory ==="
        find out -name "*.img" -type f 2>/dev/null || true
        find out -name "recovery.img" -type f 2>/dev/null || true
        
    - name: Upload Recovery Image
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: OrangeFox-Recovery-${{ env.BUILD_DATE }}
        path: |
          fox/out/target/product/zorn/recovery.img
          fox/out/target/product/zorn/OrangeFox*.zip
        retention-days: 7
        
    - name: On Build Failure
      if: failure()
      run: |
        echo "=== Build Failed ==="
        echo "Check the logs above for errors"
        echo "Common issues:"
        echo "1. Missing dependencies"
        echo "2. Patch application failures"
        echo "3. Device tree configuration errors"
        
    - name: Archive Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: Build-Logs-${{ env.BUILD_DATE }}
        path: |
          fox/out/error.log
          fox/out/build.log
        retention-days: 7
